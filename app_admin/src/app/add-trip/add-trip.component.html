<div class="container">
  <h2>Add Trip</h2>

  <form *ngIf="addForm" [formGroup]="addForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="code">Trip Code</label>
      <input type="text" class="form-control" id="code"
             formControlName="code">
    </div>

    <div class="form-group">
      <label for="name">Trip Name</label>
      <input type="text" class="form-control" id="name"
             formControlName="name">
    </div>

    <div class="form-group">
      <label for="length">Trip Length</label>
      <input type="text" class="form-control" id="length"
             formControlName="length">
    </div>

    <div class="form-group">
      <label for="start">Start Date</label>
      <input type="text" class="form-control" id="start"
             formControlName="start">
    </div>

    <div class="form-group">
      <label for="resort">Resort</label>
      <input type="text" class="form-control" id="resort"
             formControlName="resort">
    </div>

    <div class="form-group">
      <label for="perPerson">Price Per Person</label>
      <input type="text" class="form-control" id="perPerson"
             formControlName="perPerson">
    </div>

    <div class="form-group">
      <label for="image">Image</label>
      <input type="text" class="form-control" id="image"
             formControlName="image">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea class="form-control" id="description"
                formControlName="description"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Add Trip
    </button>

  </form>
</div>
